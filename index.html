<!doctype html>
<html lang="hu" data-tema="rendszer">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sejtmembrán Keresztrejtvény</title>
<meta name="description" content="Háromnyelvű sejtmembrán-keresztrejtvény a Sejtmembrán előadás anyagából, magyarul, angolul és németül, minden játékban új rácsot generálva.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* ==========================================================================
   Napfényes rajzfilmpaletta: meleg kulcsfény, hűvös árnyék, cukorka-élénk
   témakörszínek. Minden szín tokenen keresztül jut a komponensekhez, hogy a
   világos és a sötét változat is végig egy készletből dolgozzon.
   ========================================================================== */
:root {
  --alap: #FFF1E0;
  --alap-fenypont: #FFFFFF;
  --alap-hus: #FFD9C0;
  --alap-eg: #BFE1FF;
  --felulet: #FFFFFF;
  --felulet-2: #FFF6EC;
  --felulet-3: #F7E6D3;
  --tinta: #2E2318;
  --halvany: #7C6754;
  --vonal: #F0DCC7;
  --el: rgba(96, 62, 26, .22);
  --arnyek: 0 18px 34px -20px rgba(96, 62, 26, .75);

  --narancs: #FF7A18;
  --narancs-sotet: #C95900;
  --kiemeles-tinta: #FFFFFF;
  --tipp: #B87400;
  --hiba: #E63946;
  --siker: #1F9D63;

  --kat-szfingo: #E23757;   --kat-szfingo-tinta: #FFFFFF;
  --kat-lipid: #FF9F1C; --kat-lipid-tinta: #3A2500;
  --kat-szterin: #FFD23F;      --kat-szterin-tinta: #493400;
  --kat-szenhidrat: #14B8A6; --kat-szenhidrat-tinta: #04302B;
  --kat-feherje: #2D6BE0; --kat-feherje-tinta: #FFFFFF;
  --kat-dinamika: #7C3FD1;    --kat-dinamika-tinta: #FFFFFF;
  --kat-sajat: #12968A;      --kat-sajat-tinta: #FFFFFF;

  --bokeh: rgba(255, 255, 255, .40);
  --sugar: 14px;
  --sugar-nagy: 26px;
  --diszp: "Baloo 2", "Trebuchet MS", Verdana, sans-serif;
  --szoveg: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-tema="vilagos"]):not([data-theme="light"]) {
    --alap: #101B2E;
    --alap-fenypont: #24395C;
    --alap-hus: #2A2140;
    --alap-eg: #0A1120;
    --felulet: #1C2B45;
    --felulet-2: #243450;
    --felulet-3: #2E4166;
    --tinta: #F7EFE5;
    --halvany: #A8BAD4;
    --vonal: #33456A;
    --el: rgba(0, 0, 0, .5);
    --arnyek: 0 18px 36px -20px rgba(0, 0, 0, .95);
    --bokeh: rgba(130, 175, 255, .05);
    --narancs: #FF9440;
    --narancs-sotet: #B95A0C;
    --tipp: #FFC46B;
    --hiba: #FF7078;
    --siker: #3FD69B;
    --kat-szfingo: #FF6B87;   --kat-szfingo-tinta: #3A0010;
    --kat-lipid: #FFB454; --kat-lipid-tinta: #3A2500;
    --kat-szterin: #FFDE6B;      --kat-szterin-tinta: #493400;
    --kat-szenhidrat: #3FD9C6; --kat-szenhidrat-tinta: #04302B;
    --kat-feherje: #6BA2FF; --kat-feherje-tinta: #05204D;
    --kat-dinamika: #B48AF5;    --kat-dinamika-tinta: #22004F;
    --kat-sajat: #59DBCB;      --kat-sajat-tinta: #04302B;
  }
}

:root[data-tema="sotet"],
:root[data-theme="dark"]:not([data-tema="vilagos"]) {
  --alap: #101B2E;
  --alap-fenypont: #24395C;
  --alap-hus: #2A2140;
  --alap-eg: #0A1120;
  --felulet: #1C2B45;
  --felulet-2: #243450;
  --felulet-3: #2E4166;
  --tinta: #F7EFE5;
  --halvany: #A8BAD4;
  --vonal: #33456A;
  --el: rgba(0, 0, 0, .5);
  --arnyek: 0 18px 36px -20px rgba(0, 0, 0, .95);
  --bokeh: rgba(130, 175, 255, .05);
  --narancs: #FF9440;
  --narancs-sotet: #B95A0C;
  --tipp: #FFC46B;
  --hiba: #FF7078;
  --siker: #3FD69B;
  --kat-szfingo: #FF6B87;   --kat-szfingo-tinta: #3A0010;
  --kat-lipid: #FFB454; --kat-lipid-tinta: #3A2500;
  --kat-szterin: #FFDE6B;      --kat-szterin-tinta: #493400;
  --kat-szenhidrat: #3FD9C6; --kat-szenhidrat-tinta: #04302B;
  --kat-feherje: #6BA2FF; --kat-feherje-tinta: #05204D;
  --kat-dinamika: #B48AF5;    --kat-dinamika-tinta: #22004F;
  --kat-sajat: #59DBCB;      --kat-sajat-tinta: #04302B;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  color: var(--tinta);
  background: var(--alap);
  font-family: var(--szoveg);
  font-size: 15px;
  font-weight: 600;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

/* Színpadi háttér: felülről érkező meleg fény, alul hűvös ellenfény. */
.hatter {
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(120% 70% at 50% -20%, var(--alap-fenypont) 0%, transparent 60%),
    radial-gradient(90% 60% at 100% 0%, var(--alap-hus) 0%, transparent 55%),
    radial-gradient(100% 70% at 0% 100%, var(--alap-eg) 0%, transparent 60%),
    var(--alap);
}
.hatter::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 12% 22%, var(--bokeh) 0 8px, transparent 9px),
    radial-gradient(circle at 88% 14%, var(--bokeh) 0 12px, transparent 13px),
    radial-gradient(circle at 76% 78%, var(--bokeh) 0 16px, transparent 17px),
    radial-gradient(circle at 22% 84%, var(--bokeh) 0 10px, transparent 11px);
}

button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--narancs); outline-offset: 3px; }

.burok {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px 16px 104px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* ---------- Fejléc ---------- */
.fejlec { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; }
.cimblokk { flex: 1 1 260px; display: flex; flex-direction: column; gap: 0; }
.cimer {
  flex: 0 0 auto;
  width: clamp(52px, 7vw, 68px);
  height: auto;
  align-self: center;
}
/* Sötét témán fehér medál emeli ki a bordó címert. */
:root[data-tema="sotet"] .cimer,
:root[data-theme="dark"]:not([data-tema="vilagos"]) .cimer {
  background: #FFFFFF;
  border-radius: 50%;
  padding: 3px;
  box-shadow: 0 3px 0 var(--el);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="vilagos"]):not([data-theme="light"]) .cimer {
    background: #FFFFFF;
    border-radius: 50%;
    padding: 3px;
    box-shadow: 0 3px 0 var(--el);
  }
}
.intezmeny {
  font-size: 12.5px;
  font-weight: 800;
  letter-spacing: .04em;
  color: var(--halvany);
  text-wrap: balance;
}
h1 {
  font-family: var(--diszp);
  font-weight: 800;
  font-size: clamp(30px, 5vw, 46px);
  line-height: 1;
  margin: 0;
  text-wrap: balance;
  letter-spacing: .005em;
}
h1 em {
  font-style: normal;
  color: var(--narancs);
  -webkit-text-stroke: 0;
  text-shadow: 0 2px 0 var(--narancs-sotet);
}
.fejlec-eszkozok { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* ---------- Nyelvváltó ---------- */
.nyelvvalto {
  display: inline-flex;
  padding: 4px;
  gap: 3px;
  background: var(--felulet-3);
  border-radius: 999px;
  box-shadow: inset 0 2px 5px var(--el);
}
.nyelvvalto button {
  border: 0;
  background: transparent;
  color: var(--halvany);
  font-family: var(--diszp);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: .04em;
  padding: 5px 13px;
  border-radius: 999px;
  cursor: pointer;
  transition: transform .12s ease, background-color .12s ease, color .12s ease;
}
.nyelvvalto button:hover { color: var(--tinta); }
.nyelvvalto button[aria-pressed="true"] {
  background: var(--narancs);
  color: var(--kiemeles-tinta);
  box-shadow: 0 3px 0 var(--narancs-sotet);
  transform: translateY(-1px);
}

.mero {
  display: flex;
  align-items: baseline;
  gap: 7px;
  padding: 7px 14px;
  background: var(--felulet);
  border-radius: 999px;
  box-shadow: 0 3px 0 var(--el), var(--arnyek);
}
.mero .cimke {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--halvany);
}
.mero .ertek {
  font-family: var(--diszp);
  font-weight: 700;
  font-size: 17px;
  font-variant-numeric: tabular-nums;
}

/* ---------- Energiacsík ---------- */
.csik-sor { display: flex; align-items: center; gap: 12px; }
.csik {
  position: relative;
  flex: 1;
  height: 16px;
  border-radius: 999px;
  overflow: hidden;
  background: var(--felulet-3);
  box-shadow: inset 0 3px 6px var(--el);
}
.csik .toltes {
  position: absolute;
  inset: 2px;
  width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg,
    var(--kat-szfingo), var(--kat-lipid), var(--kat-szterin),
    var(--kat-szenhidrat), var(--kat-feherje), var(--kat-dinamika));
  background-size: 640px 100%;
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .55);
  transition: width .5s cubic-bezier(.34, 1.56, .64, 1);
}
.csik-cimke {
  font-weight: 800;
  font-size: 13px;
  color: var(--halvany);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* ---------- Elrendezés ---------- */
.jatekter {
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(310px, .95fr);
  grid-template-areas: "racs megh" "racs klavia";
  grid-template-rows: auto 1fr;
  gap: 18px;
  align-items: start;
}
.racs-lap { grid-area: racs; }
.megh-lap { grid-area: megh; }
.klavia { grid-area: klavia; }
@media (max-width: 900px) {
  .jatekter {
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "racs" "klavia" "megh";
    grid-template-rows: auto auto auto;
  }
}

.lap {
  background: var(--felulet);
  border-radius: var(--sugar-nagy);
  box-shadow: 0 5px 0 var(--el), var(--arnyek);
}

/* ---------- Rács ---------- */
.racs-lap { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.racs-doboz {
  container-type: inline-size;
  display: flex;
  justify-content: center;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  padding: 2px 2px 6px;
  position: relative;
}
.racs {
  display: grid;
  grid-template-columns: repeat(var(--o), 1fr);
  gap: 4px;
  width: 100%;
  max-width: calc(var(--o) * 48px);
  min-width: calc(var(--o) * 28px);
  flex: 0 0 auto;
  --akt: var(--narancs);
}
.cella {
  position: relative;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--diszp);
  font-weight: 700;
  font-size: clamp(14px, calc(58cqi / var(--o)), 28px);
  line-height: 1;
  user-select: none;
}
.cella.betu {
  border-radius: 28%;
  background: linear-gradient(180deg, var(--felulet-2) 0%, var(--felulet-3) 100%);
  box-shadow: 0 3px 0 var(--el), inset 0 2px 0 rgba(255, 255, 255, .75);
  cursor: pointer;
  color: var(--tinta);
  transition: transform .14s cubic-bezier(.34, 1.56, .64, 1),
              background-color .14s ease, box-shadow .14s ease;
}
.cella.betu:hover { transform: translateY(-2px); }
.cella .szam {
  position: absolute;
  top: 6%;
  left: 9%;
  font-family: var(--szoveg);
  font-size: clamp(8px, calc(24cqi / var(--o)), 11px);
  font-weight: 800;
  color: var(--halvany);
  line-height: 1;
}
.cella.aktiv-szo {
  background: linear-gradient(180deg,
    color-mix(in srgb, var(--akt) 22%, var(--felulet)) 0%,
    color-mix(in srgb, var(--akt) 34%, var(--felulet)) 100%);
}
.cella.aktiv {
  background: linear-gradient(180deg,
    color-mix(in srgb, var(--akt) 62%, white) 0%, var(--akt) 100%);
  color: var(--akt-tinta, var(--tinta));
  transform: translateY(-3px) scale(1.06);
  box-shadow: 0 6px 0 color-mix(in srgb, var(--akt) 60%, black),
              0 10px 18px -8px rgba(0, 0, 0, .5);
  z-index: 2;
}
.cella.aktiv .szam { color: inherit; opacity: .75; }
.cella.tippelt { color: var(--tipp); }
.cella.rossz { color: var(--hiba); }
.cella.rossz::after {
  content: "";
  position: absolute;
  inset: 14% 14% auto auto;
  width: 32%;
  height: 3px;
  border-radius: 2px;
  background: var(--hiba);
  transform: rotate(45deg);
  transform-origin: right center;
}
.cella.kesz { animation: ugras .55s cubic-bezier(.34, 1.56, .64, 1) both; }
@keyframes ugras {
  0% { transform: translateY(0) scale(1); }
  35% { transform: translateY(-26%) scale(1.12); }
  70% { transform: translateY(4%) scale(.96); }
  100% { transform: translateY(0) scale(1); }
}
.racs.indul .cella.betu { animation: bepattan .45s cubic-bezier(.34, 1.56, .64, 1) both; }
@keyframes bepattan {
  0% { transform: scale(0) rotate(-12deg); opacity: 0; }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}

/* ---------- Aktív meghatározás ---------- */
.aktiv-sav {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-radius: var(--sugar);
  background: color-mix(in srgb, var(--akt, var(--narancs)) 16%, var(--felulet));
  box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--akt, var(--narancs)) 34%, transparent);
  min-height: 62px;
}
.lepteto {
  border: 0;
  background: var(--felulet);
  border-radius: 50%;
  width: 36px;
  height: 36px;
  flex: 0 0 auto;
  cursor: pointer;
  font-family: var(--diszp);
  font-size: 18px;
  font-weight: 700;
  line-height: 1;
  box-shadow: 0 3px 0 var(--el);
  transition: transform .1s ease, box-shadow .1s ease;
}
.lepteto:active { transform: translateY(3px); box-shadow: 0 0 0 var(--el); }
.aktiv-szoveg { flex: 1; min-width: 0; }
.aktiv-szoveg .fej {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--halvany);
}
.aktiv-szoveg .meg { font-size: 16px; line-height: 1.35; text-wrap: pretty; }

/* ---------- Meghatározások ---------- */
.megh-lap { padding: 16px; display: flex; flex-direction: column; gap: 18px; }
.megh-cim {
  font-family: var(--diszp);
  font-weight: 700;
  font-size: 20px;
  margin: 0 0 8px;
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.megh-cim span { font-family: var(--szoveg); font-size: 12px; font-weight: 700; color: var(--halvany); }
ol.megh { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.megh-gomb {
  width: 100%;
  display: grid;
  grid-template-columns: 26px 1fr auto;
  align-items: center;
  gap: 10px;
  text-align: left;
  background: transparent;
  border: 0;
  border-radius: 12px;
  padding: 7px 9px;
  cursor: pointer;
  line-height: 1.35;
  font-weight: 600;
  transition: background-color .12s ease, transform .12s ease;
}
.megh-gomb:hover { background: var(--felulet-2); transform: translateX(2px); }
.megh-gomb .sorszam {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--kat);
  color: var(--kat-tinta);
  font-family: var(--diszp);
  font-size: 13px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  box-shadow: 0 2px 0 var(--el);
}
.megh-gomb .hossz { font-size: 12px; font-weight: 800; color: var(--halvany); }
.megh-gomb[aria-current="true"] {
  background: color-mix(in srgb, var(--kat) 16%, var(--felulet));
  box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--kat) 36%, transparent);
}
.megh-gomb.kesz .megh-szoveg { color: var(--halvany); text-decoration: line-through; text-decoration-thickness: 2px; }
.megh-gomb.kesz .sorszam { background: var(--siker); color: #FFFFFF; }
.megh-gomb.kesz .sorszam::after { content: "✓"; }
.megh-gomb.kesz .sorszam span { display: none; }

/* ---------- Betűsor ---------- */
.klavia { padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.klavia[hidden] { display: none; }
.klavia-sor { display: flex; gap: 5px; justify-content: center; }
.klavia button {
  flex: 1 1 0;
  min-width: 0;
  max-width: 48px;
  padding: 10px 0;
  border: 0;
  background: linear-gradient(180deg, var(--felulet-2), var(--felulet-3));
  border-radius: 11px;
  font-family: var(--diszp);
  font-weight: 700;
  font-size: 15px;
  cursor: pointer;
  box-shadow: 0 3px 0 var(--el);
  transition: transform .08s ease, box-shadow .08s ease;
}
.klavia button:active {
  transform: translateY(3px);
  box-shadow: 0 0 0 var(--el);
  background: var(--narancs);
  color: var(--kiemeles-tinta);
}
.klavia button.szeles { max-width: 96px; flex: 1.6 1 0; }

/* ---------- Gombok ---------- */
.gomb {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 16px;
  border: 0;
  background: var(--felulet);
  border-radius: 999px;
  cursor: pointer;
  font-family: var(--diszp);
  font-weight: 700;
  font-size: 15px;
  white-space: nowrap;
  box-shadow: 0 4px 0 var(--el);
  transition: transform .09s ease, box-shadow .09s ease, filter .12s ease;
}
.gomb:hover { filter: brightness(1.03); }
.gomb:active { transform: translateY(4px); box-shadow: 0 0 0 var(--el); }
.gomb.elsodleges {
  background: linear-gradient(180deg, color-mix(in srgb, var(--narancs) 82%, white), var(--narancs));
  color: var(--kiemeles-tinta);
  box-shadow: 0 4px 0 var(--narancs-sotet);
}
.gomb.elsodleges:active { box-shadow: 0 0 0 var(--narancs-sotet); }
.gomb.tipp { color: var(--tipp); }
select.gomb {
  padding-right: 10px;
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
                    linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: right 14px center, right 9px center;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 30px;
}

.eszkozsav {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--alap) 82%, transparent);
  backdrop-filter: blur(10px);
  box-shadow: 0 -8px 24px -18px rgba(0, 0, 0, .8);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
}
.eszkozsav-belso {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
}
.eszkoz-csoport { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ---------- Jelmagyarázat ---------- */
.jelmagy { display: flex; flex-wrap: wrap; gap: 7px 14px; padding: 0 4px; }
.jel { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--halvany); }
.jel .pont { width: 11px; height: 11px; border-radius: 50%; background: var(--kat); box-shadow: 0 2px 0 var(--el); }

/* ---------- Párbeszédek ---------- */
dialog {
  border: 0;
  border-radius: var(--sugar-nagy);
  background: var(--felulet);
  color: var(--tinta);
  padding: 0;
  max-width: 540px;
  width: calc(100% - 32px);
  box-shadow: 0 8px 0 var(--el), 0 40px 70px -30px rgba(0, 0, 0, .7);
}
dialog[open] { animation: pattanas .38s cubic-bezier(.34, 1.56, .64, 1); }
@keyframes pattanas {
  0% { transform: scale(.82) translateY(18px); opacity: 0; }
  100% { transform: scale(1) translateY(0); opacity: 1; }
}
dialog::backdrop { background: color-mix(in srgb, #1B1206 62%, transparent); }
.parbeszed-test { padding: 24px; display: flex; flex-direction: column; gap: 14px; }
.parbeszed-test h2 { font-family: var(--diszp); font-size: 30px; margin: 0; line-height: 1.1; }
.parbeszed-test h3 { font-family: var(--diszp); font-size: 17px; margin: 6px 0 0; }
.parbeszed-test p, .parbeszed-test li { margin: 0; color: var(--halvany); }
.parbeszed-test ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.parbeszed-test kbd {
  font-family: var(--diszp);
  font-size: 12px;
  font-weight: 700;
  border-radius: 7px;
  padding: 2px 7px;
  background: var(--felulet-3);
  color: var(--tinta);
  box-shadow: 0 2px 0 var(--el);
}
.eredmeny-racs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.eredmeny-racs div {
  background: var(--felulet-2);
  border-radius: var(--sugar);
  padding: 12px 8px;
  text-align: center;
  box-shadow: inset 0 0 0 3px var(--vonal);
}
.eredmeny-racs .e-cimke {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--halvany);
}
.eredmeny-racs .e-ertek {
  font-family: var(--diszp);
  font-size: 26px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.parbeszed-gombsor { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

/* ---------- Lábléc ---------- */
.lablec {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: baseline;
  gap: 4px 10px;
  padding: 6px 4px 0;
  text-align: center;
  font-size: 13px;
  font-weight: 600;
  color: var(--halvany);
}
.lablec p { margin: 0; }
.lablec .nev { font-family: var(--diszp); font-weight: 700; color: var(--tinta); }
.lablec .lablec-adat { flex-basis: 100%; text-transform: uppercase; letter-spacing: .08em; font-size: 11px; opacity: .85; }
.lablec a { color: var(--narancs); text-decoration-thickness: 2px; text-underline-offset: 2px; }
.lablec a:hover { color: var(--narancs-sotet); }

/* ---------- Saját lista párbeszéd ---------- */
.sablon {
  margin: 0;
  padding: 12px 14px;
  background: var(--felulet-2);
  border-radius: var(--sugar);
  box-shadow: inset 0 0 0 3px var(--vonal);
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 12px;
  line-height: 1.6;
  color: var(--tinta);
  overflow-x: auto;
  white-space: pre;
}
.apro { font-size: 13px; }
.mezo-cimke { font-family: var(--diszp); font-weight: 700; font-size: 15px; }
#sajat-szoveg {
  width: 100%;
  border: 0;
  border-radius: var(--sugar);
  background: var(--felulet-2);
  box-shadow: inset 0 0 0 3px var(--vonal);
  padding: 10px 12px;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 13px;
  resize: vertical;
}
.uzenet-doboz {
  border-radius: var(--sugar);
  padding: 10px 14px;
  font-size: 13.5px;
  background: var(--felulet-2);
  box-shadow: inset 0 0 0 3px var(--vonal);
}
.uzenet-doboz ul { padding-left: 18px; gap: 3px; }
.uzenet-doboz .rendben { color: var(--siker); font-weight: 800; }
.uzenet-doboz .gond { color: var(--hiba); font-weight: 800; }
.parbeszed-test .szet { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }

/* Rejtett mező: ezen keresztül érkezik a mobil- és IME-bevitel is. */
.rejtett-bevitel {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  border: 0;
  opacity: 0;
  caret-color: transparent;
  background: transparent;
  font-size: 16px;
}

#konfetti {
  position: fixed;
  inset: 0;
  z-index: 30;
  pointer-events: none;
}

@media (max-width: 620px) {
  .burok { padding: 14px 12px 104px; gap: 14px; }
  .fejlec-eszkozok { gap: 6px; }
  .mero { padding: 5px 11px; gap: 5px; }
  .mero .ertek { font-size: 15px; }
  .mero.masodlagos { display: none; }   /* a rekord kis kijelzőn elfér a győzelmi lapon */
  .gomb { padding: 7px 13px; font-size: 14px; }
  .szemoldok { font-size: 11px; }
  .racs-lap, .megh-lap { padding: 12px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* ==========================================================================
   3. Rejtvénygenerátor (keresztezésekre épülő elrendezés)
   ========================================================================== */
const MERET = 26;

const SZINTEK = {
  konnyu: { szo: 10, maxHossz: 8 },
  halado: { szo: 14, maxHossz: 11 },
  profi: { szo: 18, maxHossz: 14 }
};

function keverd(tomb) {
  const m = tomb.slice();
  for (let i = m.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [m[i], m[j]] = [m[j], m[i]];
  }
  return m;
}

function uresRacs() {
  return Array.from({ length: MERET }, () => new Array(MERET).fill(null));
}

/** Hány metszéspontja lenne a szónak itt? -1, ha nem fér el. */
function fer(racs, szo, r, c, vv) {
  const h = szo.length;
  if (r < 0 || c < 0 || r >= MERET || c >= MERET) return -1;
  if (vv ? c + h > MERET : r + h > MERET) return -1;

  if (vv) {
    if (c > 0 && racs[r][c - 1]) return -1;
    if (c + h < MERET && racs[r][c + h]) return -1;
  } else {
    if (r > 0 && racs[r - 1][c]) return -1;
    if (r + h < MERET && racs[r + h][c]) return -1;
  }

  let metszes = 0;
  for (let i = 0; i < h; i++) {
    const rr = vv ? r : r + i;
    const cc = vv ? c + i : c;
    const meglevo = racs[rr][cc];
    if (meglevo) {
      if (meglevo !== szo[i]) return -1;
      metszes++;
    } else if (vv) {
      if (rr > 0 && racs[rr - 1][cc]) return -1;
      if (rr + 1 < MERET && racs[rr + 1][cc]) return -1;
    } else {
      if (cc > 0 && racs[rr][cc - 1]) return -1;
      if (cc + 1 < MERET && racs[rr][cc + 1]) return -1;
    }
  }
  return metszes;
}

function tedd(racs, szo, r, c, vv) {
  for (let i = 0; i < szo.length; i++) {
    if (vv) racs[r][c + i] = szo[i];
    else racs[r + i][c] = szo[i];
  }
}

function egyProba(tetelek) {
  const racs = uresRacs();
  const lerakott = [];
  const sorrend = keverd(tetelek).sort((a, b) => b.a.length - a.a.length);

  const elso = sorrend[0];
  const r0 = Math.floor(MERET / 2);
  const c0 = Math.floor((MERET - elso.a.length) / 2);
  tedd(racs, elso.a, r0, c0, true);
  lerakott.push({ ...elso, r: r0, c: c0, vv: true });

  for (let n = 1; n < sorrend.length; n++) {
    const t = sorrend[n];
    const szo = t.a;
    let legjobb = null;

    for (let i = 0; i < szo.length; i++) {
      for (const l of lerakott) {
        for (let j = 0; j < l.a.length; j++) {
          if (l.a[j] !== szo[i]) continue;
          const vv = !l.vv;
          const kr = l.vv ? l.r : l.r + j;
          const kc = l.vv ? l.c + j : l.c;
          const r = vv ? kr : kr - i;
          const c = vv ? kc - i : kc;
          const m = fer(racs, szo, r, c, vv);
          if (m < 1) continue;
          const kozepR = vv ? r : r + szo.length / 2;
          const kozepC = vv ? c + szo.length / 2 : c;
          const tav = Math.abs(kozepR - MERET / 2) + Math.abs(kozepC - MERET / 2);
          const pont = m * 12 - tav + Math.random() * 2;
          if (!legjobb || pont > legjobb.pont) legjobb = { r, c, vv, pont };
        }
      }
    }
    if (legjobb) {
      tedd(racs, szo, legjobb.r, legjobb.c, legjobb.vv);
      lerakott.push({ ...t, r: legjobb.r, c: legjobb.c, vv: legjobb.vv });
    }
  }
  return lerakott;
}

function vagd(lerakott) {
  const minR = Math.min(...lerakott.map((l) => l.r));
  const minC = Math.min(...lerakott.map((l) => l.c));
  const maxR = Math.max(...lerakott.map((l) => (l.vv ? l.r : l.r + l.a.length - 1)));
  const maxC = Math.max(...lerakott.map((l) => (l.vv ? l.c + l.a.length - 1 : l.c)));
  return {
    sorok: maxR - minR + 1,
    oszlopok: maxC - minC + 1,
    szavak: lerakott.map((l) => ({ ...l, r: l.r - minR, c: l.c - minC }))
  };
}

/** A legjobb elrendezés kiválasztása több véletlen próbából. */
function keszitsRejtvenyt(tetelek, probak = 70) {
  let legjobb = null;
  for (let p = 0; p < probak; p++) {
    const lerakott = egyProba(tetelek);
    if (lerakott.length < 2) continue;
    const v = vagd(lerakott);
    const oldal = Math.max(v.sorok, v.oszlopok);
    const pont = v.szavak.length * 20 - oldal * 2 - Math.abs(v.sorok - v.oszlopok) * 1.5;
    if (!legjobb || pont > legjobb.pont) legjobb = { ...v, pont };
  }
  if (!legjobb) return null;

  const szavak = legjobb.szavak.sort(
    (a, b) => a.r - b.r || a.c - b.c || (a.vv ? 0 : 1) - (b.vv ? 0 : 1)
  );
  const szamok = new Map();
  let n = 0;
  for (const sz of szavak) {
    const kulcs = sz.r + ":" + sz.c;
    if (!szamok.has(kulcs)) szamok.set(kulcs, ++n);
    sz.szam = szamok.get(kulcs);
    sz.id = sz.szam + (sz.vv ? "v" : "f");
  }
  return { sorok: legjobb.sorok, oszlopok: legjobb.oszlopok, szavak };
}

/* ---------- Saját szólista ---------- */
const SAJAT_KULCS = "biokem-kr-sajat";
const FORRAS_KULCS = "biokem-kr-forras";
const TEMAKOR_KULCSOK = ["lipid", "szfingo", "szterin", "feherje", "szenhidrat", "dinamika"];
const FEJLEC_SZAVAK = [
  "temakor", "témakör", "topic", "thema", "kategoria", "kategória",
  "megfejtes", "megfejtés", "answer", "solution", "losung", "lösung", "wort",
  "meghatarozas", "meghatározás", "clue", "definition", "frage", "definicio"
];

let sajatSzavak = [];
let szoForras = "mindketto";

/** Egy CSV/TSV sor cellákra bontása, idézőjeles mezőket is kezelve. */
function bontsSort(sor, hatar) {
  const cellak = [];
  let mezo = "";
  let idezojelben = false;
  for (let i = 0; i < sor.length; i++) {
    const ch = sor[i];
    if (idezojelben) {
      if (ch === '"') {
        if (sor[i + 1] === '"') { mezo += '"'; i++; }
        else idezojelben = false;
      } else mezo += ch;
    } else if (ch === '"') {
      idezojelben = true;
    } else if (ch === hatar) {
      cellak.push(mezo.trim());
      mezo = "";
    } else mezo += ch;
  }
  cellak.push(mezo.trim());
  return cellak;
}

/** A megfejtés egységesítése: nagybetűk, szóköz és kötőjel nélkül. */
function tisztitsMegfejtest(nyers, celNyelv) {
  const abc = new Set(ABC[celNyelv]);
  const nagy = String(nyers).toUpperCase().replace(/[\s\-–—_.,'’()]/g, "");
  const rossz = [...nagy].find((ch) => !abc.has(ch));
  return { szo: nagy, rossz };
}

function temakorKulcs(nyers) {
  const t = String(nyers || "").trim().toLowerCase();
  if (!t) return "sajat";
  if (TEMAKOR_KULCSOK.includes(t)) return t;
  for (const k of TEMAKOR_KULCSOK) {
    for (const ny of Object.keys(SZOVEGEK)) {
      if (SZOVEGEK[ny].temakorok[k].toLowerCase() === t) return k;
    }
  }
  return "sajat";
}

function temakorNeve(k) {
  return k === "sajat" ? t("temakorSajat") : SZ.temakorok[k] || k;
}

/**
 * Szöveg feldolgozása szólistává.
 * Elfogadott oszlopszámok: 7 (témakör + mindhárom nyelv), 6 (mindhárom nyelv),
 * 3 (témakör + megfejtés + meghatározás) és 2 (megfejtés + meghatározás).
 * A rövid alakok az éppen beállított nyelvre kerülnek.
 */
function elemezListat(szoveg) {
  const sorok = String(szoveg).split(/\r?\n/).map((x) => x.trim()).filter(Boolean);
  const tetelek = [];
  const hibak = [];
  if (!sorok.length) return { tetelek, hibak };

  const elso = sorok[0];
  const hatar = [";", "\t", ","]
    .map((h) => ({ h, db: elso.split(h).length }))
    .sort((a, b) => b.db - a.db)[0].h;

  let kezdet = 0;
  const elsoCellak = bontsSort(elso, hatar).map((x) => x.toLowerCase());
  if (elsoCellak.some((c) => FEJLEC_SZAVAK.includes(c))) kezdet = 1;

  for (let i = kezdet; i < sorok.length; i++) {
    const c = bontsSort(sorok[i], hatar);
    const sorSzam = i + 1;
    let terv;
    if (c.length >= 7) {
      terv = { k: temakorKulcs(c[0]), parok: { hu: [c[1], c[2]], en: [c[3], c[4]], de: [c[5], c[6]] } };
    } else if (c.length === 6) {
      terv = { k: "sajat", parok: { hu: [c[0], c[1]], en: [c[2], c[3]], de: [c[4], c[5]] } };
    } else if (c.length >= 3) {
      terv = { k: temakorKulcs(c[0]), parok: { [nyelv]: [c[1], c[2]] } };
    } else if (c.length === 2) {
      terv = { k: "sajat", parok: { [nyelv]: [c[0], c[1]] } };
    } else {
      hibak.push(sorSzam + ". " + t("hibaOszlop"));
      continue;
    }

    const tetel = { k: terv.k };
    let volt = false;
    let sorHiba = null;
    for (const [ny, par] of Object.entries(terv.parok)) {
      const megfejtes = (par[0] || "").trim();
      const meghatarozas = (par[1] || "").trim();
      if (!megfejtes && !meghatarozas) continue;         // ez a nyelv üresen maradt
      if (!meghatarozas) { sorHiba = sorHiba || t("hibaMeghatarozas"); continue; }
      const { szo, rossz } = tisztitsMegfejtest(megfejtes, ny);
      if (szo.length < 3) { sorHiba = sorHiba || t("hibaRovid"); continue; }
      if (szo.length > 20) { sorHiba = sorHiba || t("hibaHosszu"); continue; }
      if (rossz) { sorHiba = sorHiba || t("hibaKarakter", { ch: rossz }); continue; }
      tetel[ny] = [szo, meghatarozas];
      volt = true;
    }
    if (volt) tetelek.push(tetel);
    else hibak.push(sorSzam + ". " + (sorHiba || t("hibaOszlop")));
  }
  return { tetelek, hibak };
}

function toltsdSajatot() {
  try {
    const nyers = localStorage.getItem(SAJAT_KULCS);
    sajatSzavak = nyers ? JSON.parse(nyers) : [];
    if (!Array.isArray(sajatSzavak)) sajatSzavak = [];
  } catch (e) { sajatSzavak = []; }
  try {
    const f = localStorage.getItem(FORRAS_KULCS);
    if (f) szoForras = f;
  } catch (e) {}
  if (!sajatSzavak.length && szoForras !== "beepitett") szoForras = "beepitett";
}

function mentsdSajatot() {
  try { localStorage.setItem(SAJAT_KULCS, JSON.stringify(sajatSzavak)); } catch (e) {}
  try { localStorage.setItem(FORRAS_KULCS, szoForras); } catch (e) {}
}

/** A szótár átalakítása a kért nyelvre: a = megfejtés, m = meghatározás. */
function nyelviKeszlet(nyelv) {
  const oszlop = { hu: 1, en: 2, de: 3 }[nyelv];
  const beepitett = SZOTAR.map((sor) => ({ k: sor[0], a: sor[oszlop][0], m: sor[oszlop][1] }));
  const sajat = sajatSzavak
    .filter((x) => x[nyelv] && x[nyelv][0])
    .map((x) => ({ k: x.k || "sajat", a: x[nyelv][0], m: x[nyelv][1] }));

  if (szoForras === "sajat") return sajat.length >= 6 ? sajat : sajat.concat(beepitett);
  if (szoForras === "mindketto") return sajat.concat(beepitett);
  return beepitett;
}

function valasszTeteleket(nehezseg, temakor, nyelv) {
  const szint = SZINTEK[nehezseg] || SZINTEK.halado;
  const kell = szint.szo;
  const teljes = nyelviKeszlet(nyelv);
  const rovid = (lista) => lista.filter((w) => w.a.length <= szint.maxHossz);

  if (temakor === "mind") return keverd(rovid(teljes)).slice(0, kell);

  // A választott témakör szavai az elsődlegesek; ha kevés van, előbb a
  // hosszabbak, majd a többi témakör szavai egészítik ki a készletet.
  const koron = teljes.filter((w) => w.k === temakor);
  const keszlet = keverd(rovid(koron));
  if (keszlet.length < kell) {
    for (const w of keverd(koron)) if (!keszlet.includes(w)) keszlet.push(w);
  }
  if (keszlet.length < kell) {
    for (const w of keverd(rovid(teljes))) {
      if (keszlet.length >= kell) break;
      if (!keszlet.includes(w)) keszlet.push(w);
    }
  }
  return keszlet.slice(0, kell);
}

/** Addig próbálkozik friss szókészlettel, amíg minden kért szó elfér. */
function generaljTeljeset(nehezseg, temakor, nyelv) {
  const cel = (SZINTEK[nehezseg] || SZINTEK.halado).szo;
  let legjobb = null;
  for (let i = 0; i < 4; i++) {
    const r = keszitsRejtvenyt(valasszTeteleket(nehezseg, temakor, nyelv));
    if (!r) continue;
    if (!legjobb || r.szavak.length > legjobb.szavak.length) legjobb = r;
    if (legjobb.szavak.length >= cel) break;
  }
  return legjobb;
}

/* ---------- Rács ---------- */
function epitsRacsot() {
  const racs = E("racs");
  const { sorok, oszlopok, szavak } = allapot.rejtveny;
  racs.style.setProperty("--o", oszlopok);
  racs.innerHTML = "";
  cellaElemek = new Map();

  const megoldas = new Map();
  const sorszamok = new Map();
  for (const sz of szavak) {
    for (let i = 0; i < sz.a.length; i++) {
      const r = sz.vv ? sz.r : sz.r + i;
      const c = sz.vv ? sz.c + i : sz.c;
      megoldas.set(kulcs(r, c), sz.a[i]);
    }
    if (!sorszamok.has(kulcs(sz.r, sz.c))) sorszamok.set(kulcs(sz.r, sz.c), sz.szam);
  }
  allapot.megoldas = megoldas;

  for (let r = 0; r < sorok; r++) {
    for (let c = 0; c < oszlopok; c++) {
      const cella = document.createElement("div");
      const k = kulcs(r, c);
      if (megoldas.has(k)) {
        cella.className = "cella betu";
        cella.dataset.r = r;
        cella.dataset.c = c;
        cella.setAttribute("role", "gridcell");
        cella.style.animationDelay = (r + c) * 12 + "ms";
        const szam = sorszamok.get(k);
        if (szam) {
          const s = document.createElement("span");
          s.className = "szam";
          s.textContent = szam;
          cella.appendChild(s);
        }
        const b = document.createElement("span");
        b.className = "ertek";
        cella.appendChild(b);
        cellaElemek.set(k, cella);
      } else {
        cella.className = "cella";
        cella.setAttribute("aria-hidden", "true");
      }
      racs.appendChild(cella);
    }
  }

  racs.classList.add("indul");
  setTimeout(() => racs.classList.remove("indul"), 900);
}

function szavakAtCellan(r, c) {
  return allapot.rejtveny.szavak.filter((sz) => {
    if (sz.vv) return sz.r === r && c >= sz.c && c < sz.c + sz.a.length;
    return sz.c === c && r >= sz.r && r < sz.r + sz.a.length;
  });
}

function aktivSzo() {
  if (!allapot.kijelolt) return null;
  const { r, c } = allapot.kijelolt;
  const talalatok = szavakAtCellan(r, c);
  const kivant = allapot.irany === "vv";
  return talalatok.find((sz) => sz.vv === kivant) || talalatok[0] || null;
}

function szoCellai(sz) {
  const lista = [];
  for (let i = 0; i < sz.a.length; i++) {
    lista.push(sz.vv ? { r: sz.r, c: sz.c + i } : { r: sz.r + i, c: sz.c });
  }
  return lista;
}

function szoKesz(sz) {
  return szoCellai(sz).every((p, i) => allapot.betuk[kulcs(p.r, p.c)] === sz.a[i]);
}

/* ---------- Meghatározás-listák ---------- */
function epitsMeghatarozasokat() {
  const vv = allapot.rejtveny.szavak.filter((sz) => sz.vv);
  const ff = allapot.rejtveny.szavak.filter((sz) => !sz.vv);
  toltsListat(E("vv-lista"), vv);
  toltsListat(E("ff-lista"), ff);
  E("vv-db").textContent = t("szoDb", { n: vv.length });
  E("ff-db").textContent = t("szoDb", { n: ff.length });

  const hasznalt = [...new Set(allapot.rejtveny.szavak.map((sz) => sz.k))];
  E("jelmagy").innerHTML = hasznalt
    .map(
      (k) =>
        '<span class="jel" style="--kat: var(--kat-' + k + ')"><span class="pont"></span>' +
        temakorNeve(k) + "</span>"
    )
    .join("");
}

function toltsListat(lista, szavak) {
  lista.innerHTML = "";
  for (const sz of szavak) {
    const li = document.createElement("li");
    const g = document.createElement("button");
    g.className = "megh-gomb";
    g.style.setProperty("--kat", "var(--kat-" + sz.k + ")");
    g.style.setProperty("--kat-tinta", "var(--kat-" + sz.k + "-tinta)");
    g.dataset.id = sz.id;
    g.innerHTML =
      '<span class="sorszam"><span>' + sz.szam + "</span></span>" +
      '<span class="megh-szoveg"></span>' +
      '<span class="hossz">' + sz.a.length + "</span>";
    g.querySelector(".megh-szoveg").textContent = sz.m;
    g.addEventListener("click", () => {
      allapot.kijelolt = { r: sz.r, c: sz.c };
      allapot.irany = sz.vv ? "vv" : "ff";
      const ures = szoCellai(sz).find((p) => !allapot.betuk[kulcs(p.r, p.c)]);
      if (ures) allapot.kijelolt = ures;
      fokuszal();
      frissitsMindent();
    });
    li.appendChild(g);
    lista.appendChild(li);
  }
}

/* ---------- Megjelenítés ---------- */
function frissitsMindent() {
  const akt = aktivSzo();
  const racs = E("racs");
  racs.style.setProperty("--akt", akt ? "var(--kat-" + akt.k + ")" : "var(--narancs)");
  racs.style.setProperty("--akt-tinta", akt ? "var(--kat-" + akt.k + "-tinta)" : "var(--kiemeles-tinta)");

  const aktivCellak = new Set(akt ? szoCellai(akt).map((p) => kulcs(p.r, p.c)) : []);
  const kijeloltKulcs = allapot.kijelolt ? kulcs(allapot.kijelolt.r, allapot.kijelolt.c) : null;
  const tippeltek = new Set(allapot.tippeltek);
  const rosszak = new Set(allapot.rosszak);

  for (const [k, cella] of cellaElemek) {
    const betu = allapot.betuk[k] || "";
    const ertek = cella.querySelector(".ertek");
    if (ertek.textContent !== betu) ertek.textContent = betu;
    cella.classList.toggle("aktiv-szo", aktivCellak.has(k));
    cella.classList.toggle("aktiv", k === kijeloltKulcs);
    cella.classList.toggle("tippelt", tippeltek.has(k));
    cella.classList.toggle("rossz", rosszak.has(k));
  }

  for (const sz of allapot.rejtveny.szavak) {
    const g = document.querySelector('.megh-gomb[data-id="' + sz.id + '"]');
    if (!g) continue;
    g.classList.toggle("kesz", szoKesz(sz));
    g.setAttribute("aria-current", akt && akt.id === sz.id ? "true" : "false");
  }

  if (akt) {
    E("aktiv-sav").style.setProperty("--akt", "var(--kat-" + akt.k + ")");
    E("aktiv-fej").textContent =
      (akt.vv ? t("vizszintes") : t("fuggoleges")) + " " + akt.szam + " · " +
      t("betuDb", { n: akt.a.length }) + " · " + temakorNeve(akt.k);
    E("aktiv-meg").textContent = akt.m;
  } else {
    E("aktiv-fej").textContent = "";
    E("aktiv-meg").textContent = t("kezdes");
  }

  const kesz = allapot.rejtveny.szavak.filter(szoKesz).length;
  const ossz = allapot.rejtveny.szavak.length;
  const szazalek = Math.round((kesz / ossz) * 100);
  E("toltes").style.width = szazalek + "%";
  E("csik").setAttribute("aria-valuenow", szazalek);
  E("csik-cimke").textContent = t("haladas", { kesz, ossz });
  E("tipp-szam").textContent = allapot.tippek;
  E("rekord").textContent = rekordSzoveg(allapot.nehezseg);

  mentsd();
  if (kesz === ossz && !allapot.kesz) gyoztunk();
}

/* ---------- Mozgás és beírás ---------- */
function lepj(dr, dc) {
  if (!allapot.kijelolt) return;
  const { sorok, oszlopok } = allapot.rejtveny;
  let { r, c } = allapot.kijelolt;
  while (true) {
    r += dr;
    c += dc;
    if (r < 0 || c < 0 || r >= sorok || c >= oszlopok) return;
    if (cellaElemek.has(kulcs(r, c))) {
      allapot.kijelolt = { r, c };
      frissitsMindent();
      return;
    }
  }
}

function kovetkezoCella(elore = true) {
  const akt = aktivSzo();
  if (!akt) return;
  const cellak = szoCellai(akt);
  const idx = cellak.findIndex((p) => p.r === allapot.kijelolt.r && p.c === allapot.kijelolt.c);
  const uj = idx + (elore ? 1 : -1);
  if (uj >= 0 && uj < cellak.length) allapot.kijelolt = cellak[uj];
}

function beirBetut(ch) {
  if (!allapot.kijelolt || allapot.kesz) return;
  // A felfedett betűk zároltak: a kurzor átugorja őket.
  let k = kulcs(allapot.kijelolt.r, allapot.kijelolt.c);
  while (allapot.tippeltek.includes(k)) {
    const elozo = allapot.kijelolt;
    kovetkezoCella(true);
    if (allapot.kijelolt === elozo) {
      frissitsMindent();
      return;
    }
    k = kulcs(allapot.kijelolt.r, allapot.kijelolt.c);
  }
  allapot.betuk[k] = ch;
  allapot.rosszak = allapot.rosszak.filter((x) => x !== k);

  const akt = aktivSzo();
  kovetkezoCella(true);
  frissitsMindent();
  if (akt && szoKesz(akt)) villantsd(akt);
}

function villantsd(sz) {
  szoCellai(sz).forEach((p, i) => {
    const cella = cellaElemek.get(kulcs(p.r, p.c));
    if (!cella) return;
    cella.classList.remove("kesz");
    void cella.offsetWidth;
    cella.style.animationDelay = i * 45 + "ms";
    cella.classList.add("kesz");
    setTimeout(() => {
      cella.classList.remove("kesz");
      cella.style.animationDelay = "";
    }, 700 + i * 45);
  });
}

function torolBetut() {
  if (!allapot.kijelolt || allapot.kesz) return;
  const k = kulcs(allapot.kijelolt.r, allapot.kijelolt.c);
  if (allapot.betuk[k] && !allapot.tippeltek.includes(k)) {
    delete allapot.betuk[k];
    allapot.rosszak = allapot.rosszak.filter((x) => x !== k);
  } else {
    let elozo = allapot.kijelolt;
    kovetkezoCella(false);
    let k2 = kulcs(allapot.kijelolt.r, allapot.kijelolt.c);
    while (allapot.tippeltek.includes(k2) && allapot.kijelolt !== elozo) {
      elozo = allapot.kijelolt;
      kovetkezoCella(false);
      k2 = kulcs(allapot.kijelolt.r, allapot.kijelolt.c);
    }
    if (!allapot.tippeltek.includes(k2)) {
      delete allapot.betuk[k2];
      allapot.rosszak = allapot.rosszak.filter((x) => x !== k2);
    }
  }
  frissitsMindent();
}

function valtsIranyt() {
  if (!allapot.kijelolt) return;
  const talalatok = szavakAtCellan(allapot.kijelolt.r, allapot.kijelolt.c);
  if (talalatok.length < 2) return;
  allapot.irany = allapot.irany === "vv" ? "ff" : "vv";
  frissitsMindent();
}

function ugorjSzora(delta) {
  const szavak = allapot.rejtveny.szavak;
  const akt = aktivSzo();
  const idx = akt ? szavak.findIndex((sz) => sz.id === akt.id) : -1;
  const uj = szavak[(idx + delta + szavak.length) % szavak.length];
  allapot.irany = uj.vv ? "vv" : "ff";
  const ures = szoCellai(uj).find((p) => !allapot.betuk[kulcs(p.r, p.c)]);
  allapot.kijelolt = ures || { r: uj.r, c: uj.c };
  frissitsMindent();
}

/* ---------- Ellenőrzés és tippek ---------- */
function ellenoriz() {
  const rosszak = [];
  for (const [k, betu] of Object.entries(allapot.betuk)) {
    if (allapot.megoldas.get(k) !== betu) rosszak.push(k);
  }
  allapot.rosszak = rosszak;
  frissitsMindent();
  jelezz(rosszak.length === 0 ? t("mindHelyes") : t("hibasBetuk", { n: rosszak.length }));
}

function felfedBetu() {
  if (!allapot.kijelolt || allapot.kesz) return;
  const k = kulcs(allapot.kijelolt.r, allapot.kijelolt.c);
  if (allapot.betuk[k] === allapot.megoldas.get(k)) {
    kovetkezoCella(true);
    frissitsMindent();
    return;
  }
  allapot.betuk[k] = allapot.megoldas.get(k);
  if (!allapot.tippeltek.includes(k)) allapot.tippeltek.push(k);
  allapot.rosszak = allapot.rosszak.filter((x) => x !== k);
  allapot.tippek++;
  const akt = aktivSzo();
  kovetkezoCella(true);
  frissitsMindent();
  if (akt && szoKesz(akt)) villantsd(akt);
}

function felfedSzo() {
  const akt = aktivSzo();
  if (!akt || allapot.kesz) return;
  let volt = false;
  szoCellai(akt).forEach((p, i) => {
    const k = kulcs(p.r, p.c);
    if (allapot.betuk[k] !== akt.a[i]) {
      allapot.betuk[k] = akt.a[i];
      if (!allapot.tippeltek.includes(k)) allapot.tippeltek.push(k);
      allapot.rosszak = allapot.rosszak.filter((x) => x !== k);
      volt = true;
    }
  });
  if (volt) allapot.tippek++;
  frissitsMindent();
  villantsd(akt);
}

function felfedMind() {
  if (!confirm(t("megoldasKerdes"))) return;
  for (const [k, betu] of allapot.megoldas) {
    if (allapot.betuk[k] !== betu) {
      allapot.betuk[k] = betu;
      if (!allapot.tippeltek.includes(k)) allapot.tippeltek.push(k);
    }
  }
  allapot.rosszak = [];
  allapot.feladta = true;
  allapot.tippek += 10;
  frissitsMindent();
}

/* ---------- Óra, pontszám, rekord ---------- */
function idoSzoveg(mp) {
  const p = Math.floor(mp / 60);
  const m = mp % 60;
  return String(p).padStart(2, "0") + ":" + String(m).padStart(2, "0");
}

function inditsOrat() {
  clearInterval(oraId);
  E("ora").textContent = idoSzoveg(allapot.eltelt);
  oraId = setInterval(() => {
    if (allapot.kesz) return;
    allapot.eltelt++;
    E("ora").textContent = idoSzoveg(allapot.eltelt);
    if (allapot.eltelt % 5 === 0) mentsd();
  }, 1000);
}

function pontszam() {
  const szavak = allapot.rejtveny.szavak.length;
  return Math.max(0, szavak * 100 - allapot.tippek * 40 - Math.floor(allapot.eltelt / 10));
}

function rekordok() {
  try {
    return JSON.parse(localStorage.getItem(REKORD_KULCS) || "{}");
  } catch (e) {
    return {};
  }
}

function rekordSzoveg(nehezseg) {
  const r = rekordok()[nyelv + ":" + nehezseg];
  return r ? idoSzoveg(r.ido) : "–";
}

function gyoztunk() {
  allapot.kesz = true;
  clearInterval(oraId);

  const feladta = allapot.feladta === true;
  if (!feladta) {
    const r = rekordok();
    const kulcsSzo = nyelv + ":" + allapot.nehezseg;
    const elozo = r[kulcsSzo];
    if (!elozo || allapot.eltelt < elozo.ido) {
      r[kulcsSzo] = { ido: allapot.eltelt, pont: pontszam(), datum: Date.now() };
      try { localStorage.setItem(REKORD_KULCS, JSON.stringify(r)); } catch (e) {}
    }
  }
  E("rekord").textContent = rekordSzoveg(allapot.nehezseg);

  E("gyozelem-cim").textContent = feladta ? t("feladtaCim") : t("gyozelemCim");
  E("gyozelem-szoveg").textContent = feladta
    ? t("feladtaSzoveg")
    : allapot.tippek === 0
      ? t("gyozelemTiszta")
      : t("gyozelemTippel", { n: allapot.tippek });
  E("ered-ido").textContent = idoSzoveg(allapot.eltelt);
  E("ered-tipp").textContent = allapot.tippek;
  E("ered-pont").textContent = feladta ? 0 : pontszam();
  try { localStorage.removeItem(MENTES_KULCS); } catch (e) {}
  E("gyozelem").showModal();
  if (!feladta) konfetti();
}

function jelezz(szoveg) {
  E("aktiv-meg").textContent = szoveg;
  setTimeout(() => {
    const akt = aktivSzo();
    if (akt) E("aktiv-meg").textContent = akt.m;
  }, 2400);
}

/* ---------- Konfetti ---------- */
function konfetti() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const vaszon = E("konfetti");
  const ctx = vaszon.getContext("2d");
  const arany = window.devicePixelRatio || 1;
  vaszon.width = window.innerWidth * arany;
  vaszon.height = window.innerHeight * arany;
  ctx.scale(arany, arany);

  const szinek = ["#E23757", "#FF9F1C", "#FFD23F", "#14B8A6", "#2D6BE0", "#7C3FD1", "#FF7A18"];
  const reszek = Array.from({ length: 140 }, () => ({
    x: window.innerWidth / 2 + (Math.random() - .5) * 220,
    y: window.innerHeight / 2 + (Math.random() - .5) * 80,
    vx: (Math.random() - .5) * 13,
    vy: Math.random() * -13 - 4,
    meret: 5 + Math.random() * 7,
    forog: Math.random() * Math.PI,
    porget: (Math.random() - .5) * .3,
    szin: szinek[Math.floor(Math.random() * szinek.length)]
  }));

  let kepkocka = 0;
  (function rajzol() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    let latszik = false;
    for (const p of reszek) {
      p.vy += .32;
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= .995;
      p.forog += p.porget;
      if (p.y < window.innerHeight + 40) latszik = true;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.forog);
      ctx.fillStyle = p.szin;
      ctx.fillRect(-p.meret / 2, -p.meret / 2, p.meret, p.meret * .6);
      ctx.restore();
    }
    kepkocka++;
    if (latszik && kepkocka < 260) requestAnimationFrame(rajzol);
    else ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  })();
}

/* ---------- Mentés ---------- */
function mentsd() {
  if (!allapot || allapot.kesz) return;
  try {
    const { megoldas, ...menteni } = allapot;
    localStorage.setItem(MENTES_KULCS, JSON.stringify(menteni));
  } catch (e) { /* privát mód: mentés nélkül is játszható */ }
}

function toltsdBe() {
  try {
    const nyers = localStorage.getItem(MENTES_KULCS);
    if (!nyers) return null;
    const a = JSON.parse(nyers);
    if (!a || !a.rejtveny || !Array.isArray(a.rejtveny.szavak) || !a.rejtveny.szavak.length) return null;
    if (a.nyelv !== nyelv) return null; // a megfejtések nyelvenként mások
    a.kesz = false;
    return a;
  } catch (e) {
    return null;
  }
}

/* ==========================================================================
   5. Képernyő-billentyűzet
   ========================================================================== */
function epitsKlaviat() {
  const doboz = E("klavia");
  const db = BETUK.length;
  const soronkent = Math.ceil(db / 3);
  const sorok = [
    BETUK.slice(0, soronkent),
    BETUK.slice(soronkent, soronkent * 2),
    BETUK.slice(soronkent * 2)
  ];
  doboz.innerHTML = "";
  sorok.forEach((sor, i) => {
    const div = document.createElement("div");
    div.className = "klavia-sor";
    sor.forEach((b) => {
      const g = document.createElement("button");
      g.type = "button";
      g.textContent = b;
      g.addEventListener("mousedown", (ev) => ev.preventDefault());
      g.addEventListener("click", () => { beirBetut(b); fokuszal(); });
      div.appendChild(g);
    });
    if (i === sorok.length - 1) {
      const torol = document.createElement("button");
      torol.type = "button";
      torol.className = "szeles";
      torol.textContent = "⌫";
      torol.setAttribute("aria-label", SZ.aria.torles);
      torol.addEventListener("mousedown", (ev) => ev.preventDefault());
      torol.addEventListener("click", () => { torolBetut(); fokuszal(); });
      div.appendChild(torol);

      const valt = document.createElement("button");
      valt.type = "button";
      valt.className = "szeles";
      valt.textContent = "⇄";
      valt.setAttribute("aria-label", SZ.aria.iranyvaltas);
      valt.addEventListener("mousedown", (ev) => ev.preventDefault());
      valt.addEventListener("click", () => { valtsIranyt(); fokuszal(); });
      div.appendChild(valt);
    }
    doboz.appendChild(div);
  });
}

/* ==========================================================================
   6. Saját lista párbeszéd
   ========================================================================== */
const SABLON = [
  "temakor;megfejtes_hu;meghatarozas_hu;megfejtes_en;meghatarozas_en;megfejtes_de;meghatarozas_de",
  "aminosav;GLICIN;A legegyszerűbb aminosav;GLYCINE;The simplest amino acid;GLYCIN;Die einfachste Aminosäure",
  "sajat;ATP;A sejt energiavalutája;ATP;The energy currency of the cell;ATP;Die Energiewährung der Zelle",
  "",
  "KODON;Három bázisból álló kódszó"
].join("\n");

function frissitsSajatUzenetet(eredmeny) {
  const doboz = E("sajat-eredmeny");
  const db = sajatSzavak.filter((x) => x[nyelv] && x[nyelv][0]).length;
  let html = "";
  if (eredmeny) {
    html += '<div class="rendben">' + t("sajatEredmeny", { ok: eredmeny.tetelek.length }) + "</div>";
    if (eredmeny.hibak.length) {
      html += '<div class="gond">' + t("sajatKimaradt", { n: eredmeny.hibak.length }) + "</div><ul>" +
        eredmeny.hibak.slice(0, 8).map((h) => "<li>" + h + "</li>").join("") +
        (eredmeny.hibak.length > 8 ? "<li>…</li>" : "") + "</ul>";
    }
  }
  html += "<div>" + (sajatSzavak.length ? t("sajatAllapot", { n: db }) : t("sajatUres")) + "</div>";
  doboz.innerHTML = html;
}

function frissitsForrasValasztot() {
  const v = E("sajat-forras");
  v.innerHTML =
    '<option value="beepitett">' + t("sajatForrasBeepitett") + "</option>" +
    '<option value="sajat">' + t("sajatForrasSajat") + "</option>" +
    '<option value="mindketto">' + t("sajatForrasMindketto") + "</option>";
  v.value = szoForras;
}

function alkalmazdListat(szoveg, kezi) {
  const eredmeny = elemezListat(szoveg);
  if (eredmeny.tetelek.length) {
    sajatSzavak = eredmeny.tetelek;
    if (szoForras === "beepitett") szoForras = "mindketto";
    if (kezi) { try { localStorage.setItem("biokem-kr-sajat-kezi", "1"); } catch (e) {} }
    mentsdSajatot();
    allitsNyelvet(nyelv, false);   // a témakörlista is megkapja a saját kört
    frissitsForrasValasztot();
    ujJatek();
  }
  frissitsSajatUzenetet(eredmeny);
  return eredmeny;
}

E("sajat-gomb").addEventListener("click", () => {
  E("sajat-sablon").textContent = SABLON;
  frissitsForrasValasztot();
  frissitsSajatUzenetet(null);
  E("sajat").showModal();
});

E("sajat-fajl").addEventListener("change", async (ev) => {
  const fajl = ev.target.files && ev.target.files[0];
  if (!fajl) return;
  const szoveg = await fajl.text();
  E("sajat-szoveg").value = szoveg;
  alkalmazdListat(szoveg, true);
  ev.target.value = "";
});

E("sajat-betolt").addEventListener("click", () => alkalmazdListat(E("sajat-szoveg").value, true));

E("sajat-torol").addEventListener("click", () => {
  sajatSzavak = [];
  szoForras = "beepitett";
  E("sajat-szoveg").value = "";
  try { localStorage.removeItem("biokem-kr-sajat-kezi"); } catch (e) {}
  mentsdSajatot();
  allitsNyelvet(nyelv, false);
  frissitsForrasValasztot();
  frissitsSajatUzenetet(null);
  ujJatek();
});

E("sajat-forras").addEventListener("change", (ev) => {
  szoForras = ev.target.value;
  mentsdSajatot();
  ujJatek();
});

E("sajat-bezar").addEventListener("click", () => E("sajat").close());
E("sajat").addEventListener("close", fokuszalVissza);

/** Ha a játék mellé fel van töltve egy szavak.csv, azt is beolvassuk. */
async function toltsdSzerverListat() {
  if (!/^https?:$/.test(location.protocol)) return;   // fájlból megnyitva nincs mit kérni
  let kezi = false;
  try { kezi = localStorage.getItem("biokem-kr-sajat-kezi") === "1"; } catch (e) {}
  if (kezi) return;                                   // a saját feltöltés erősebb
  try {
    const valasz = await fetch("szavak.csv", { cache: "no-cache" });
    if (!valasz.ok) return;
    const szoveg = await valasz.text();
    const eredmeny = elemezListat(szoveg);
    if (!eredmeny.tetelek.length) return;
    sajatSzavak = eredmeny.tetelek;
    if (szoForras === "beepitett") szoForras = "mindketto";
    mentsdSajatot();
    allitsNyelvet(nyelv, false);
    ujJatek();
  } catch (e) { /* nincs ilyen fájl: marad a beépített lista */ }
}

/* ==========================================================================
   7. Bevitel és események
   ========================================================================== */
const rejtett = E("rejtett");

function fokuszal() {
  rejtett.value = " ";
  if (document.activeElement !== rejtett) rejtett.focus({ preventScroll: true });
}

/** Fókusz visszaadása a rácsnak gombhasználat után. Érintőképernyőn nem
    kérjük vissza, hogy ne ugorjon fel a rendszerbillentyűzet magától. */
function fokuszalVissza() {
  if (window.matchMedia("(pointer: coarse)").matches) return;
  fokuszal();
}

// Az ékezetes betűket több beviteli mód (mobil billentyűzet, IME, halott
// billentyű) nem keydown-nal, hanem szövegbeszúrással küldi.
rejtett.addEventListener("input", () => {
  const szoveg = rejtett.value.replace(/\s/g, "");
  rejtett.value = " ";
  for (const ch of szoveg) {
    const nagy = ch.toUpperCase();
    if (BETUK.includes(nagy)) beirBetut(nagy);
  }
});

rejtett.addEventListener("beforeinput", (ev) => {
  if (ev.inputType && ev.inputType.indexOf("delete") === 0) {
    ev.preventDefault();
    rejtett.value = " ";
    torolBetut();
  }
});

E("racs").addEventListener("click", (ev) => {
  const cella = ev.target.closest(".cella.betu");
  if (!cella) return;
  const r = Number(cella.dataset.r);
  const c = Number(cella.dataset.c);
  const azonos = allapot.kijelolt && allapot.kijelolt.r === r && allapot.kijelolt.c === c;
  allapot.kijelolt = { r, c };
  if (azonos) {
    valtsIranyt();
  } else {
    const talalatok = szavakAtCellan(r, c);
    const kivant = allapot.irany === "vv";
    if (!talalatok.some((sz) => sz.vv === kivant)) allapot.irany = kivant ? "ff" : "vv";
    frissitsMindent();
  }
  fokuszal();
});

document.addEventListener("keydown", (ev) => {
  if (ev.target.tagName === "SELECT") return;
  if (ev.target.tagName === "INPUT" && ev.target !== rejtett) return;
  if (document.querySelector("dialog[open]")) return;
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const rejtettben = ev.target === rejtett;

  switch (ev.key) {
    case "ArrowUp": ev.preventDefault(); allapot.irany = "ff"; lepj(-1, 0); return;
    case "ArrowDown": ev.preventDefault(); allapot.irany = "ff"; lepj(1, 0); return;
    case "ArrowLeft": ev.preventDefault(); allapot.irany = "vv"; lepj(0, -1); return;
    case "ArrowRight": ev.preventDefault(); allapot.irany = "vv"; lepj(0, 1); return;
    case "Backspace":
      // A rejtett mezőben a beforeinput ág törli a betűt.
      if (!rejtettben) { ev.preventDefault(); torolBetut(); }
      return;
    case "Delete": ev.preventDefault(); torolBetut(); return;
    case " ": ev.preventDefault(); valtsIranyt(); return;
    case "Tab": ev.preventDefault(); ugorjSzora(ev.shiftKey ? -1 : 1); return;
    case "Enter": ev.preventDefault(); ugorjSzora(1); return;
  }

  if (!rejtettben && ev.key.length === 1) {
    const nagy = ev.key.toUpperCase();
    if (BETUK.includes(nagy)) {
      ev.preventDefault();
      beirBetut(nagy);
    }
  }
});

for (const g of document.querySelectorAll("#nyelvvalto button")) {
  g.addEventListener("click", () => {
    if (g.dataset.nyelv === nyelv) return;
    allitsNyelvet(g.dataset.nyelv);
  });
}

E("uj-gomb").addEventListener("click", () => { E("gyozelem").close(); ujJatek(); });
E("ellenoriz-gomb").addEventListener("click", () => { ellenoriz(); fokuszalVissza(); });
E("betu-gomb").addEventListener("click", () => { felfedBetu(); fokuszalVissza(); });
E("szo-gomb").addEventListener("click", () => { felfedSzo(); fokuszalVissza(); });
E("megold-gomb").addEventListener("click", () => { felfedMind(); fokuszalVissza(); });
E("elozo-gomb").addEventListener("click", () => { ugorjSzora(-1); fokuszalVissza(); });
E("kovetkezo-gomb").addEventListener("click", () => { ugorjSzora(1); fokuszalVissza(); });
E("gyozelem").addEventListener("close", fokuszalVissza);
E("sugo").addEventListener("close", fokuszalVissza);
E("nehezseg").addEventListener("change", () => ujJatek());
E("temakor").addEventListener("change", () => ujJatek());
E("sugo-gomb").addEventListener("click", () => E("sugo").showModal());
E("sugo-bezar").addEventListener("click", () => E("sugo").close());
E("gyozelem-bezar").addEventListener("click", () => E("gyozelem").close());
E("gyozelem-uj").addEventListener("click", () => { E("gyozelem").close(); ujJatek(); });

E("klavia-gomb").addEventListener("click", () => {
  const doboz = E("klavia");
  const latszik = doboz.hidden;
  doboz.hidden = !latszik;
  E("klavia-gomb").setAttribute("aria-expanded", String(latszik));
  try { localStorage.setItem("biokem-kr-klavia", latszik ? "1" : "0"); } catch (e) {}
  fokuszal();
});

E("tema-gomb").addEventListener("click", () => {
  const sotetE = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const most = document.documentElement.dataset.tema;
  let uj;
  if (most === "sotet") uj = "vilagos";
  else if (most === "vilagos") uj = "sotet";
  else uj = sotetE ? "vilagos" : "sotet";
  document.documentElement.dataset.tema = uj;
  try { localStorage.setItem("biokem-kr-tema", uj); } catch (e) {}
});

/* ==========================================================================
   8. Címer
   ==========================================================================
   Beágyazott kép esetén a CIMER_ADAT állandóba kerül a data: URL. Ha üres,
   a játék az index.html mellé tett cimer.svg vagy cimer.png fájlt keresi;
   ha az sincs, a fejléc egyszerűen címer nélkül jelenik meg.
   ========================================================================== */
const CIMER_ADAT = "";
const CIMER_FAJLOK = ["cimer.svg", "cimer.png", "cimer.jpg"];

function toltsdCimert() {
  const kep = E("cimer");
  const jeloltek = CIMER_ADAT ? [CIMER_ADAT] : CIMER_FAJLOK.slice();

  const kovetkezo = () => {
    const forras = jeloltek.shift();
    if (!forras) { kep.hidden = true; return; }
    kep.src = forras;
  };
  kep.addEventListener("error", kovetkezo);
  kep.addEventListener("load", () => { kep.hidden = false; });
  kovetkezo();
}

/* ==========================================================================
   9. Indulás
   ========================================================================== */
(function indul() {
  try {
    const tema = localStorage.getItem("biokem-kr-tema");
    if (tema) document.documentElement.dataset.tema = tema;
  } catch (e) {}

  let kezdoNyelv = "hu";
  try {
    const mentettNyelv = localStorage.getItem(NYELV_KULCS);
    if (mentettNyelv && SZOVEGEK[mentettNyelv]) kezdoNyelv = mentettNyelv;
    else {
      const bongeszo = (navigator.language || "hu").slice(0, 2).toLowerCase();
      if (SZOVEGEK[bongeszo]) kezdoNyelv = bongeszo;
    }
  } catch (e) {}

  let klaviaNyitva = !window.matchMedia("(pointer: coarse)").matches;
  try {
    const mentettKlavia = localStorage.getItem("biokem-kr-klavia");
    if (mentettKlavia !== null) klaviaNyitva = mentettKlavia === "1";
  } catch (e) {}

  toltsdSajatot();
  toltsdCimert();
  allitsNyelvet(kezdoNyelv, false);
  E("klavia").hidden = !klaviaNyitva;
  E("klavia-gomb").setAttribute("aria-expanded", String(klaviaNyitva));
  fokuszal();

  const mentett = toltsdBe();
  if (mentett) {
    E("nehezseg").value = mentett.nehezseg;
    E("temakor").value = mentett.temakor;
    ujJatek(mentett);
  } else {
    ujJatek();
  }

  toltsdSzerverListat();
})();
</script>
